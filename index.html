<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guess The Note</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #a0a0a0;
      font-family: 'Architects Daughter', Arial, sans-serif;
    }
    #app-root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    #runtime-error-box {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      background: #2c080a;
      color: #ff7b72;
      border: 2px solid #f85149;
      border-radius: 8px;
      padding: 12px;
      z-index: 999999;
      font-family: monospace;
      display: none;
    }
  </style>
  <script>
    window.addEventListener('error', function(e) {
      console.error('[GuessTheNote Runtime Error]', e);
      var errBox = document.getElementById('runtime-error-box');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerHTML = '<div style="font-weight:bold; color:#ff7b72; margin-bottom:4px;">❌ Runtime Exception</div>' +
          '<div>' + (e.message || String(e)) + '</div>' +
          '<div style="font-size:11px; color:#8b949e; margin-top:4px;">at ' + (e.filename || 'script') + ':' + e.lineno + '</div>';
      }
    });
  </script>
  <script src="/Library/DomBasics.js"></script>
  <script src="/Library/LunoLoader.js"></script>
</head>
<body>
  <div id="runtime-error-box"></div>
  <div id="app-root"></div>
  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      try {
        console.log('[GuessTheNote] Booting via LunoLoader...');
        var result = await LunoLoader.loadApp("app-root");
        console.log('[GuessTheNote] Loader result:', result);
      } catch (err) {
        console.error('[GuessTheNote Boot Error]', err);
        var errBox = document.getElementById('runtime-error-box');
        if (errBox) {
          errBox.style.display = 'block';
          errBox.innerHTML = '<div style="font-weight:bold; color:#ff7b72; margin-bottom:4px;">❌ Boot Loader Exception</div>' +
            '<pre style="font-size:11px; color:#ff7b72; white-space:pre-wrap;">' + (err.stack || err.message) + '</pre>';
        }
      }
    });
  </script>
</body>
</html>
