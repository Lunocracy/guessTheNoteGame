<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guess The Note</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap">
  <script src="/Library/DomBasics.js"></script>
  <script src="/app/LunoLoader.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #a0a0a0;
    }
    #app-root {
      width: 100%;
      height: 100%;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="app-root"></div>
  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      if (typeof LunoLoader !== "undefined") {
        await LunoLoader.loadApp("app-root");
      }
    });
  </script>
</body>
</html>
